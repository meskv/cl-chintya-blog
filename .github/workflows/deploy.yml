name: Deploy Chintya to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Poll Notion for changes even with no code changes. Notion has no
    # outbound webhook for plain database edits, so polling is the
    # reliable option. 15 minutes is comfortably inside Notion's rate
    # limits for a single integration doing two small database reads.
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLES_DB_ID }}
          NOTION_AUTHORS_DB_ID: ${{ secrets.NOTION_AUTHORS_DB_ID }}
        run: npm run sync:notion

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
